# ═══════════════════════════════════════════════════════════════════════════
# CamoFox Mac — pfctl Anchor Rules (Force Mode)
# ═══════════════════════════════════════════════════════════════════════════
# These rules are loaded into the "com.camofox" anchor by camofox-mac.sh.
# They redirect all outbound TCP traffic to a local transparent proxy and
# block direct DNS queries to prevent leaks.
#
# Variables (replaced at load time by camofox-mac.sh):
#   $PF_INTERFACE   — Network interface (e.g. en0)
#   $LOCAL_PROXY_PORT — Local transparent proxy port (e.g. 12345)
#   $PROXY_IP       — iPhone SOCKS proxy IP (excluded from redirect)
# ═══════════════════════════════════════════════════════════════════════════

# ---------------------------------------------------------------------------
# NAT/Redirect rules — rdr anchor
# ---------------------------------------------------------------------------
# Redirect all outbound TCP from this machine to the local transparent proxy.
# Exclude:
#   - Traffic to localhost (127.0.0.0/8)
#   - Traffic to the iPhone proxy itself (so the proxy_helper can reach it)
#   - Traffic to link-local (169.254.0.0/16)
#   - Traffic to private networks (optional, for LAN access)

# Redirect all TCP traffic to local transparent proxy
rdr pass on lo0 proto tcp from any to !127.0.0.0/8 -> 127.0.0.1 port $LOCAL_PROXY_PORT

# ---------------------------------------------------------------------------
# Filter rules — anchor
# ---------------------------------------------------------------------------

# Allow traffic to/from localhost
pass quick on lo0 all

# Allow traffic to the iPhone SOCKS proxy (so proxy_helper.py can connect)
pass out quick proto tcp from any to $PROXY_IP
pass out quick proto udp from any to $PROXY_IP

# Block direct DNS (UDP port 53) to prevent leaks
# Only 127.0.0.1 (local DNS resolver) is allowed
block drop quick proto udp from any to !127.0.0.1 port 53
block drop quick proto tcp from any to !127.0.0.1 port 53

# Allow all other traffic (it will be redirected through the proxy)
pass out all
